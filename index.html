<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RTH – Runtime Transfer Hub · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
h1 { color:#0f0; letter-spacing:4px; margin-bottom:30px; }
.block { background:#111; border:1px solid #333; padding:25px; margin-bottom:30px; border-radius:8px; }
.title { font-size:22px; color:#6cf; margin-bottom:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:15px; white-space:pre-wrap; }
</style>

<script type="module">
import { RTH_LOAD } from "./RTH.loader.js";

(async function(){

    /* PQ / TMP / Albertus laden */
    const pq = await RTH_LOAD("d:/tmp/PQ.hdf");
    const tmp9 = await RTH_LOAD("9x9.tmp");
    const albertus = await RTH_LOAD("Albertus.hdf");

    document.getElementById("pq").innerText =
        pq ? "PQ geladen (80GB chunked)" : "PQ nicht gefunden";

    document.getElementById("tmp").innerText =
        tmp9 ? "9×9 TMP geladen" : "TMP nicht gefunden";

    document.getElementById("albertus").innerText =
        albertus ? "Albertus geladen" : "Albertus nicht gefunden";

})();
</script>

</head>

<body>

<h1>RTH – Runtime Transfer Hub · iki1uc</h1>

<div class="block">
    <div class="title">PQ‑Storage</div>
    <pre id="pq"></pre>
</div>

<div class="block">
    <div class="title">TMP‑Matrix (9×9)</div>
    <pre id="tmp"></pre>
</div>

<div class="block">
    <div class="title">Albertus‑Datensatz</div>
    <pre id="albertus"></pre>
</div>

</body>
</html>
